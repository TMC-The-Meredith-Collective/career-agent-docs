<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description | escape }}">
    <meta name="referrer" content="no-referrer">
    <title>{{ page.title | escape }}</title>
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; color: #24202d; background: #faf9fc; }
      body { margin: 0; line-height: 1.7; }
      header, main, footer { max-width: 52rem; margin: auto; padding: 1.5rem; }
      header { border-bottom: 3px solid #76b900; }
      header a { font-weight: 700; }
      h1, h2 { line-height: 1.25; color: #241338; }
      h1 { font-size: clamp(1.8rem, 5vw, 2.7rem); }
      h2 { margin-top: 2.5rem; font-size: 1.35rem; }
      a { color: #5923a8; text-underline-offset: .18em; overflow-wrap: anywhere; }
      a:focus-visible { outline: 3px solid #5923a8; outline-offset: 4px; }
      li { margin-bottom: .7rem; }
      code { overflow-wrap: anywhere; }
      footer { border-top: 1px solid #d8d1e1; font-size: .9rem; }
      .skip { position: absolute; left: -9999px; }
      .skip:focus { position: static; padding: 1rem; }
    </style>
  </head>
  <body>
    <a class="skip" href="#content">Skip to content</a>
    <header><a href="{{ '/' | relative_url }}">JARVIS / Career Agent</a> · Public documentation</header>
    <main id="content">{{ content }}</main>
    <footer><a href="{{ '/privacy/' | relative_url }}">Privacy Policy</a> · <a href="{{ '/terms/' | relative_url }}">Terms of Service</a> · The Meredith Collective</footer>
  </body>
</html>
